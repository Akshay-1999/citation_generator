server {
    listen 80;
    server_name recai.estuate.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name recai.estuate.com;
    client_max_body_size 100M;

    # SSL Certificate Paths
    ssl_certificate /etc/ssl/certs/recai.estuate.com.crt;
    ssl_certificate_key /etc/ssl/private/recai.estuate.com.key;

    # Optimization for SSL
    ssl_session_cache shared:le_nginx_SSL:1m;
    ssl_session_timeout 1440m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(auth|user|main|file|chat|folder|conversion) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static {
        alias /home/production69/myapp/citation_generator/static;
    }

    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
}
