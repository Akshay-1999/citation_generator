<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recruitment Assistant - Secure Login">
    <title>Recruitment Assistant — Login</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #f8fafc, #eff6ff);
            overflow: auto;
            /* Allow scroll if needed on tiny screens */
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            animation: slideUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 3rem;
            box-shadow:
                0 25px 50px -12px rgba(15, 23, 42, 0.1),
                0 0 0 1px rgba(15, 23, 42, 0.05);
            text-align: center;
        }

        .login-brand {
            margin-bottom: 2.5rem;
        }

        .brand-logo-large {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.25);
        }

        .login-brand h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .login-brand p {
            color: #64748b;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .login-form {
            text-align: left;
        }

        .login-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer links */
        .login-footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .login-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.5rem;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Custom Toast for Login */
        .login-toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1e293b;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .login-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .login-toast.toast-error {
            border-left: 4px solid #ef4444;
        }

        .login-toast.toast-success {
            border-left: 4px solid #10b981;
        }
    </style>
</head>

<body>

    <div id="toast" class="login-toast"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-logo-large">💼</div>
                <h1>Recruitment Assistant</h1>
                <p>Sign in to your workplace</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="name@company.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    Sign In
                </button>
            </form>

            <div class="login-footer">
                Need an account? <a href="#">Contact Admin</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const toast = document.getElementById('toast');
        const loginBtn = document.getElementById('loginBtn');

        function showToast(message, type = 'error') {
            toast.textContent = message;
            toast.className = `login-toast show toast-${type}`;
            setTimeout(() => { toast.classList.remove('show'); }, 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showToast('Please enter both email and password.');
                return;
            }

            // State update
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showToast('Welcome back! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/static/dashboard.html';
                    }, 800);
                } else {
                    showToast(data.detail || 'Access denied. Please check your credentials.');
                }
            } catch (err) {
                showToast('Network error. Please try again later.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Sign In';
            }
        });
    </script>

</body>

</html>
